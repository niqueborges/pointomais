services:
  customer-db:
    image: postgres:18
    container_name: pointomais-customer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: pointomais
      POSTGRES_PASSWORD: pointomais_dev
    ports:
      - "5432:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql

volumes:
  customer-db-data:
